services:
  # Existing Python FastAPI agent stays on its original image/runtime.
  python-agent:
    build:
      context: ./api/agent
      dockerfile: Dockerfile
    container_name: fox-python-agent
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_PORT=8000
    env_file:
      - path: ./api/.env
        required: false
    volumes:
      - ./api/agent/Tts/piper_models:/app/Tts/piper_models
    restart: unless-stopped

  # Realtime LiveKit voice worker is opt-in so normal startup remains unchanged.
  # It uses a separate image containing the official upstream Hermes checkout.
  voice-worker:
    profiles: ["voice"]
    build:
      context: ./api/agent
      dockerfile: Dockerfile.voice
      args:
        HERMES_UPSTREAM_REF: ${HERMES_UPSTREAM_REF:-v2026.8.27}
    container_name: fox-livekit-voice-worker
    env_file:
      - path: ./api/.env
        required: false
    environment:
      - HERMES_RUNTIME=auto
      - HERMES_UPSTREAM_PATH=/opt/hermes-agent
      - VOICE_TTS_PROVIDER=edge
    volumes:
      - ./api/agent/Tts/piper_models:/app/Tts/piper_models
    restart: unless-stopped

  # Node.js / Express API server + OpenWakeWord service, one container (ports 3001 & 8011)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fox-jarvis-api
    ports:
      - "3001:3001"
      - "8011:8011"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - HERMES_FASTAPI_URL=http://python-agent:8000
      - WAKEWORD_PORT=8011
      - WAKEWORD_SERVICE_URL=http://127.0.0.1:8011
      - WAKEWORD_PUBLIC_WS_URL=ws://localhost:8011/ws
      - WAKEWORD_ENABLED=true
      - WAKEWORD_PHRASE=Hey Jarvis
      - WAKEWORD_MODEL_KEY=hey jarvis
      - WAKEWORD_MODEL_PATH=
      - WAKEWORD_THRESHOLD=0.5
      - WAKEWORD_COOLDOWN_SECONDS=3.0
    env_file:
      - path: ./api/.env
        required: false
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - python-agent
    restart: unless-stopped

  # React / Vite frontend (port 3000)
  app:
    image: node:22-alpine
    container_name: fox-jarvis-app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped

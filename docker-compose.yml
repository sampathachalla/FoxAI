name: fox-jarvis

x-common: &common
  restart: unless-stopped
  networks:
    - fox-network

# OpenTelemetry settings shared by every instrumented service. Each service
# adds its own OTEL_SERVICE_NAME. Set OTEL_SDK_DISABLED=true (e.g. in a root
# .env file) to turn telemetry off without removing the observability service.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=fox,deployment.environment.name=${FOX_ENVIRONMENT:-development}
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}

services:
  api:
    <<: *common
    # Public boundary for REST, WebSocket/streaming, auth and service routing.
    labels:
      fox.layer: api
      fox.current-stack: "Node.js, Express, REST, LiveKit token gateway"
      fox.planned-stack: "WebSocket, message stream, OpenTelemetry"
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fox-api
    env_file:
      - path: ./deploy/env/api.env
        required: false
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: fox-api
      # Loads OpenTelemetry's zero-code Node instrumentation before the app.
      NODE_OPTIONS: --require @opentelemetry/auto-instrumentations-node/register
      # Skip cloud-provider metadata probes (AWS/GCP/Azure) outside the cloud.
      OTEL_NODE_RESOURCE_DETECTORS: env,host,os,process,serviceinstance,container
      PORT: "3001"
      NODE_ENV: ${NODE_ENV:-development}
      HERMES_URL: http://hermes:8000
      HERMES_GATEWAY_KEY: ${HERMES_GATEWAY_KEY:-fox-dev-only-hermes-key}
      VOICE_TTS_URL: http://voice:8200
      DATABASE_URL: postgresql://${POSTGRES_USER:-fox}:${POSTGRES_PASSWORD:-fox-dev-only}@postgres:5432/${POSTGRES_DB:-fox}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - ./api:/app
      - api-node-modules:/app/node_modules
    depends_on:
      hermes:
        condition: service_started
      voice:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  hermes:
    <<: *common
    # Reasoning/orchestration: upstream Nous Research Hermes and Agent Reach,
    # served by Hermes' own OpenAI-compatible API server. Fox's own tools come
    # from mcp-server over MCP (see agents/hermes/config.yaml).
    labels:
      fox.layer: agent
      fox.current-stack: "Nous Research Hermes gateway, Agent Reach, MCP client"
      fox.planned-stack: "workflows, Graphiti, telemetry emitters"
    build:
      context: ./agents
      dockerfile: ../deploy/docker/agents.Dockerfile
      args:
        HERMES_UPSTREAM_REF: ${HERMES_UPSTREAM_REF:-v2026.8.27}
    container_name: fox-hermes
    env_file:
      - path: ./deploy/env/hermes.env
        required: false
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: fox-hermes
      # Bearer key for Hermes' API server; api and voice send the same value.
      API_SERVER_KEY: ${HERMES_GATEWAY_KEY:-fox-dev-only-hermes-key}
      FOX_MCP_URL: http://mcp-server:8100/mcp
    ports:
      - "${HERMES_PORT:-8000}:8000"
    volumes:
      - agent-reach-data:/root/.agent-reach
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mcp-server:
    <<: *common
    # Fox's own tools over MCP, used by Hermes.
    labels:
      fox.layer: tools
      fox.current-stack: "MCP Python SDK, Streamable HTTP"
      fox.planned-stack: "persistent notes/reminders, data-backed tools"
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: fox-mcp-server
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: fox-mcp-server
      DATABASE_URL: postgresql://${POSTGRES_USER:-fox}:${POSTGRES_PASSWORD:-fox-dev-only}@postgres:5432/${POSTGRES_DB:-fox}
    ports:
      - "${MCP_SERVER_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  voice:
    <<: *common
    # Realtime ears/mouth: LiveKit transport, STT, TTS and turn detection, plus
    # HTTP Edge/Piper speech (:8200) for the API's non-LiveKit voice path.
    labels:
      fox.layer: voice
      fox.current-stack: "LiveKit Agents, Groq Whisper, Edge/Piper/Deepgram TTS"
      fox.planned-stack: "additional local and cloud voice providers"
    build:
      context: ./voice
      dockerfile: Dockerfile
    container_name: fox-voice
    env_file:
      - path: ./deploy/env/voice.env
        required: false
    environment:
      <<: *otel
      HERMES_URL: http://hermes:8000
      HERMES_GATEWAY_KEY: ${HERMES_GATEWAY_KEY:-fox-dev-only-hermes-key}
      VOICE_TTS_PROVIDER: ${VOICE_TTS_PROVIDER:-edge}
    ports:
      - "${VOICE_TTS_PORT:-8200}:8200"
    volumes:
      - ./voice/tts/piper_models:/app/tts/piper_models:ro
    depends_on:
      hermes:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8200/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  observability:
    <<: *common
    # Traces, metrics and logs for every service, with Grafana dashboards.
    # Grafana (Tempo traces, Loki logs, Prometheus metrics, Pyroscope
    # profiles) behind one OpenTelemetry collector.
    labels:
      fox.layer: observability
      fox.current-stack: "Grafana LGTM: OpenTelemetry Collector, Tempo, Loki, Prometheus, Pyroscope, Grafana"
    image: grafana/otel-lgtm:0.35.0
    container_name: fox-observability
    env_file:
      - path: ./deploy/env/observability.env
        required: false
    environment:
      # Require a Grafana login (the image defaults to anonymous admin access).
      # Credentials come from deploy/env/observability.env.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - observability-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  postgres:
    <<: *common
    # Transactional application data plus vector embeddings/search.
    labels:
      fox.layer: data
      fox.current-stack: "PostgreSQL 16, pgvector"
      fox.use-cases: "relational data, sessions, memory, vector search"
    image: pgvector/pgvector:pg16
    container_name: fox-postgres
    env_file:
      - path: ./deploy/env/postgres.env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fox}
      POSTGRES_USER: ${POSTGRES_USER:-fox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fox-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    <<: *common
    # Optional knowledge graph; defined now but disabled by default.
    labels:
      fox.layer: data
      fox.current-stack: "Neo4j Community"
      fox.use-cases: "entities, relationships, knowledge graph"
    image: neo4j:5-community
    container_name: fox-neo4j
    profiles: ["extended"]
    env_file:
      - path: ./deploy/env/neo4j.env
        required: false
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/fox-dev-only}
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    <<: *common
    # Optional S3-compatible storage; defined now but disabled by default.
    labels:
      fox.layer: data
      fox.current-stack: "MinIO"
      fox.use-cases: "audio, documents, images, model artifacts"
    image: minio/minio:latest
    container_name: fox-minio
    profiles: ["extended"]
    command: server /data --console-address ":9001"
    env_file:
      - path: ./deploy/env/minio.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foxadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-fox-dev-only}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  fox-network:
    name: fox-network
    driver: bridge

volumes:
  api-node-modules:
  observability-data:
  agent-reach-data:
  postgres-data:
  neo4j-data:
  minio-data:

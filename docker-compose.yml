services:
  # Combined Python service: FastAPI agent (port 8000) + LiveKit voice worker.
  # They remain separate processes so their Hermes/Python imports stay isolated.
  voice-worker:
    build:
      context: ./api/agent
      dockerfile: Dockerfile.voice
      args:
        HERMES_UPSTREAM_REF: ${HERMES_UPSTREAM_REF:-v2026.8.27}
    container_name: fox-livekit-voice-worker
    ports:
      - "8000:8000"
    env_file:
      - path: ./api/.env
        required: false
    environment:
      - HERMES_RUNTIME=auto
      - HERMES_UPSTREAM_PATH=/opt/hermes-agent
      - VOICE_TTS_PROVIDER=edge
      - FASTAPI_PORT=8000
      # Heavy work is delegated to the FastAPI process in this same container.
      - HERMES_FASTAPI_URL=http://127.0.0.1:8000
      # Flip to "true" to instead run the full upstream Hermes runtime inside
      # this worker (needs a large per-minute token budget, e.g. Groq Dev tier
      # or a non-Groq HERMES_BASE_URL). The settings below only apply then.
      - VOICE_USE_INPROCESS_HERMES=false
      - HERMES_ENABLED_TOOLSETS=web
      - HERMES_MAX_ITERATIONS=3
      - HERMES_SKIP_MEMORY=true
      - HERMES_SKIP_CONTEXT_FILES=true
    volumes:
      - ./api/agent/tts/piper_models:/app/tts/piper_models
    restart: unless-stopped

  # Node.js / Express API server (port 3001)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: fox-jarvis-api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - HERMES_FASTAPI_URL=http://voice-worker:8000
      - WAKEWORD_ENABLED=false
    env_file:
      - path: ./api/.env
        required: false
    volumes:
      - ./api:/app
      - /app/node_modules
    depends_on:
      - voice-worker
    restart: unless-stopped

  # React / Vite frontend (port 3000). Talks to the API through Vite's `/api`
  # proxy; inside Compose the proxy target is the `api` service, not localhost.
  app:
    image: node:22-alpine
    container_name: fox-jarvis-app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_PROXY_TARGET=http://api:3001
    volumes:
      - ./app:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
